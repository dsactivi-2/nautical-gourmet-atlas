version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: nautical-gourmet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nautical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-nautical_gourmet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nautical}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nautical-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: nautical-gourmet-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nautical}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nautical_gourmet}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-nautical}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nautical_gourmet}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      DEBUG: "false"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nautical-network

volumes:
  postgres_data:

networks:
  nautical-network:
    driver: bridge
