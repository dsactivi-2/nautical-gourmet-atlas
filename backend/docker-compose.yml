version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nautical-gourmet-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nautical_gourmet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: nautical-gourmet-api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/nautical_gourmet
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/nautical_gourmet
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
